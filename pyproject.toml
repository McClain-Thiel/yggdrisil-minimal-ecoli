[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yggdrisil-ecoli"
version = "0.1.0"
description = "An E. coli K-12 MG1655 genome-minimization application for Yggdrisil."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "McClain Thiel" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.10",
    "pyarrow>=18",
    "yggdrisil @ git+https://github.com/McClain-Thiel/yggdrisil.git@67983c5c0821c57e6b0f60449b3e608b981455e2",
]

[project.optional-dependencies]
agents = [
    "pydantic-ai>=2.0,<3",
    "python-dotenv>=1.0,<2",
]
data = [
    "openpyxl>=3.1",
    "pypdf>=5,<7",
]
fba = [
    "cobra==0.32.1",
    "optlang==1.9.1",
    "swiglpk==5.0.13",
]
rba = [
    "RBApy==3.0.3",
    "RBAtools==2.0.1",
    "setuptools==80.10.2",
    "swiglpk==5.0.13",
]
dev = [
    "build>=1.2",
    "mypy>=1.13",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
]

[project.scripts]
yggdrisil-ecoli-search = "yggdrisil_ecoli.search:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yggdrisil_ecoli = ["py.typed"]

[tool.uv]
# RBAtools pulls SBtab's obsolete openpyxl cap; this evaluator uses no SBtab workbook APIs.
override-dependencies = ["openpyxl>=3.1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = ["src/yggdrisil_ecoli", "scripts"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "cobra",
    "cobra.*",
    "openpyxl",
    "openpyxl.*",
    "numpy",
    "numpy.*",
    "openai",
    "openai.*",
    "pyarrow",
    "pyarrow.*",
    "pypdf",
    "pypdf.*",
    "rba",
    "rba.*",
    "rbatools",
    "rbatools.*",
    "swiglpk",
]
ignore_missing_imports = true
follow_imports = "skip"
