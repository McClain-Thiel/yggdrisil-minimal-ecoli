[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yggdrisil-ecoli"
version = "0.1.0"
description = "An E. coli K-12 MG1655 genome-minimization application for Yggdrisil."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "McClain Thiel" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.10",
    "pyarrow>=18",
    "yggdrisil @ git+https://github.com/McClain-Thiel/yggdrisil.git@d114144e4696989aacb85a4159c4177909deef1f",
]

[project.optional-dependencies]
data = [
    "openpyxl>=3.1",
]
fba = [
    "cobra==0.32.1",
    "optlang==1.9.1",
    "swiglpk==5.0.13",
]
dev = [
    "build>=1.2",
    "mypy>=1.13",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
]

[project.scripts]
yggdrisil-ecoli-build-registry = "yggdrisil_ecoli.data_build:main"
yggdrisil-ecoli-audit-crosswalks = "yggdrisil_ecoli.data.audit:main"
yggdrisil-ecoli-build-essentiality = "yggdrisil_ecoli.essentiality_build:main"
yggdrisil-ecoli-build-modules = "yggdrisil_ecoli.module_build:main"
yggdrisil-ecoli-search = "yggdrisil_ecoli.search:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yggdrisil_ecoli = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = ["src/yggdrisil_ecoli", "scripts"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["cobra", "cobra.*", "openpyxl", "openpyxl.*", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true
