[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yggdrisil-ecoli"
version = "0.1.0"
description = "An E. coli K-12 MG1655 genome-minimization application for Yggdrisil."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "McClain Thiel" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.10",
    "pyarrow>=18",
    "pandas>=2.2,<4",
    "lark>=1.2,<2",
    "boolean.py>=5,<6",
    "yggdrisil @ git+https://github.com/McClain-Thiel/yggdrisil.git@bf390ddcee567ff705085273394a4b929a8c0005",
]

[project.optional-dependencies]
agents = [
    "pydantic-ai>=2.0,<3",
    "python-dotenv>=1.0,<2",
]
data = [
    "gffutils>=0.13,<0.15",
    "pooch>=1.9,<2",
    "pysam>=0.23,<0.25",
    "openpyxl>=3.1",
    "pypdf>=5,<7",
]
notebooks = [
    "marimo>=0.21.1,<1",
    "huggingface-hub>=0.34,<2",
]
fba = [
    "cobra==0.32.1",
    "optlang==1.9.1",
    "swiglpk==5.0.13",
]
rba = [
    "RBApy==3.0.3",
    "RBAtools==2.0.1",
    "setuptools==80.10.2",
    "swiglpk==5.0.13",
]
dev = [
    "build>=1.2",
    "mypy>=1.13",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yggdrisil_ecoli = ["py.typed", "resources/*.txt"]

[tool.uv]
# RBAtools pulls SBtab's obsolete openpyxl cap; no SBtab workbook APIs are used.
override-dependencies = ["openpyxl>=3.1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = ["src/yggdrisil_ecoli"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["cobra", "cobra.*", "openpyxl", "openpyxl.*", "pyarrow", "pyarrow.*", "gffutils", "gffutils.*", "pandas", "pandas.*", "pooch", "pooch.*", "pysam", "pysam.*", "boolean", "boolean.*", "rba", "rba.*", "rbatools", "rbatools.*", "swiglpk"]
ignore_missing_imports = true
