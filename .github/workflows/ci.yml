name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install uv
          uv sync --extra agents --extra data --extra fba --extra rba --extra notebooks --extra dev
      - name: Test
        run: .venv/bin/python -m pytest
      - name: Lint
        run: .venv/bin/ruff check src tests scripts
      - name: Check types
        run: .venv/bin/mypy src
      - name: Check experiment notebook
        run: .venv/bin/marimo check scripts/experiment.py
