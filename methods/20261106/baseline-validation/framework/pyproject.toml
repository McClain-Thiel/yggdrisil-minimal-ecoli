[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yggdrisil"
version = "0.1.0"
description = "A persistent DAG-search framework for agentic optimization."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "McClain Thiel" }]
keywords = ["search", "tree-search", "dag", "agents", "optimization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "networkx>=3.2",
]

[project.optional-dependencies]
agents = [
    "pydantic>=2.10",
    "google-adk>=2.13,<2.14",
    "litellm[mcp]>=1.84,<2",
]
dev = [
    "build>=1.2",
    "mypy>=1.13",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "types-networkx>=3.2",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[project.urls]
Homepage = "https://github.com/McClain-Thiel/yggdrisil"
Documentation = "https://mcclain-thiel.github.io/yggdrisil/"
Issues = "https://github.com/McClain-Thiel/yggdrisil/issues"

[project.scripts]
yggdrisil = "yggdrisil.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yggdrisil = ["py.typed", "web/*.css", "web/*.html", "web/*.js"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", ".", "examples"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src/yggdrisil"]
strict = true
warn_unreachable = true
